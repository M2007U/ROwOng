<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;   /* 🔒 disable scrollbars */
}
</style>

</head>
<body>

<iframe
    id="ringFrame"
    src="index.html"
    scrolling="no"
    style="
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
    "
></iframe>

<script>
const iframe = document.getElementById("ringFrame");



var CurrentEdge = 1 //can be 0 or 1 , startedge or endedge
var AStart = 0
var AEnd = 0

iframe.contentWindow.postMessage([
{
    opr: "canvasSize",
    kw: 400,
    kh: 400
}],"*")

setInterval(() => {
    if (CurrentEdge === 1) //endEdgeMoves
    {
        AEnd++
        if (360 <= AEnd)
        {
            AEnd = 0
            CurrentEdge = 0
        }
        iframe.contentWindow.postMessage([
        {
            opr: "ring",
            ri: 70,
            ro: 100,
            as: 0,
            ae: AEnd,
            co: "rgba(255,192,0,1)"
        }],"*")
    }
    else if (CurrentEdge === 0)
    {
        AStart++
        if (360 <= AStart)
        {
            AStart = 0
            CurrentEdge = 1
        }
        iframe.contentWindow.postMessage([
        {
            opr:"ring",
            ri: 70,
            ro: 100,
            as: AStart,
            ae: 0,
            co: "rgba(255,192,0,1)"
        }],"*")
    }
}, 1);


</script>

</body>
</html>
